<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Mando</title>
<style>html,body{margin:0;height:100%;background:#0b0d1a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}#m{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;box-sizing:border-box;text-align:center}input,button{font:inherit;padding:12px;border-radius:10px;border:2px solid #555;background:#1b1f33;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;width:100%;overflow:auto;max-height:66vh;touch-action:pan-y}.g div{border:3px solid #333;border-radius:8px;overflow:hidden;font-size:11px}.g img{width:100%;display:block}.g .s{border-color:#ffd23f}.g .x{opacity:.3}.cv{position:relative;width:min(100vw,177.78vh);aspect-ratio:1672/941;background-size:100% 100%}.hs{position:absolute;touch-action:none}.hs i{position:absolute;inset:0;border-radius:18px;opacity:0;transition:opacity .06s;box-shadow:0 0 28px 12px var(--c);background:radial-gradient(var(--c),transparent 70%)}.hs.r i{border-radius:50%}.hs.on i{opacity:.85}#fl{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;transition:opacity .25s}</style>
<div id="m"></div><div id="fl"></div><script src="/data.js"></script><script src="/play.js"></script></html>
